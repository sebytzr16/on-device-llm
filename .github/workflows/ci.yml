name: Validate Android and iOS app
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.44.0', '3.47.5']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Resolved dependencies must match the committed lockfile (S19). The
      # lockfile is resolved with the build's Flutter; the oldest supported
      # SDK pins some packages (intl) to other versions, so it re-resolves.
      - name: Verify pubspec.lock is committed
        if: matrix.flutter == '3.47.5'
        run: git diff --exit-code pubspec.lock
      - run: dart run build_runner build
      # Formatter output differs between Dart versions; check with the build's Flutter.
      - if: matrix.flutter == '3.47.5'
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: bash scripts/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-cpu-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: bash scripts/build_ios.sh
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/ios/iphoneos/Runner.app
